<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Via Umbra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* --- POLLEN VERT : spores depuis la fleur --- */
    .particles-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 3; /* passe DEVANT la fleur */
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--color, rgba(0, 255, 170, 0.9));
      box-shadow: 0 0 8px var(--glow, rgba(0, 255, 170, 0.9));
      opacity: 0;
      animation: drift 100s linear forwards;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      10% { opacity: 1; }
      95% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.9); opacity: 0; }
    }

    /* CONTENU CENTRAL */
    .content {
      position: relative;
      text-align: center;
      z-index: 2;
      padding: 2rem;
      animation: breathe 16s ease-in-out infinite;
    }

    @keyframes breathe {
      0%   { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-4px) scale(1.01); }
      100% { transform: translateY(0) scale(1); }
    }

    /* IMAGE CENTRALE */
    .logo {
      max-width: min(420px, 80vw);
      max-height: min(520px, 70vh);
      object-fit: contain;
      display: block;
      margin: 0 auto 1.5rem;
    }

    .title {
      font-size: clamp(2.4rem, 4vw, 3.4rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 400;
      margin-bottom: 0.2rem;
      color: #f8fff9;
      text-shadow:
        0 0 18px rgba(0, 255, 170, 0.6),
        0 0 40px rgba(0, 120, 70, 0.9);
    }

    .sound-btn{
      margin-top: 1.2rem;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0,255,170,.55);
      background: rgba(0,0,0,.35);
      color: #eafff6;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .85rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .sound-btn:hover{
      background: rgba(0,255,170,.12);
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="particles-layer"></div>

    <section class="content">
      <img src="01.png" alt="Fleur-Fantôme Via Umbra" class="logo" />
      <h1 class="title">VIA UMBRA</h1>

      <button id="soundToggle" class="sound-btn" aria-pressed="false">
        Activer le son
      </button>
    </section>
  </main>

  <script>
    // --- POLLEN ---
    function spawnPollen() {
      const layer = document.querySelector('.particles-layer');
      const logo = document.querySelector('.logo');
      if (!logo || !layer) return;

      const rect = logo.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const p = document.createElement('div');
      p.className = 'particle';

      // Taille : spores de 4px et 6px
      const size = Math.random() < 0.7 ? 4 : 6;
      p.style.setProperty('--size', size + 'px');

      // Mélange de teintes : 80% vert turquoise, 20% vert plus franc
      const greener = Math.random() < 0.2;

      let color, glow;
      if (greener) {
        color = 'rgba(0, 255, 120, 0.95)';
        glow  = 'rgba(0, 255, 120, 1)';
      } else {
        color = 'rgba(0, 255, 170, 0.9)';
        glow  = 'rgba(0, 255, 170, 1)';
      }

      p.style.setProperty('--color', color);
      p.style.setProperty('--glow', glow);

      // Naissance au centre de la fleur
      p.style.left = centerX + 'px';
      p.style.top = (centerY - 30) + 'px';

      // Direction aléatoire
      const angle = Math.random() * Math.PI * 2;
      const maxDim = Math.max(window.innerWidth, window.innerHeight);
      const distance = maxDim * 1.2;

      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance;

      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');

      layer.appendChild(p);

      // suppression après la fin (un peu après l'anim pour être safe)
      setTimeout(() => p.remove(), 130000);
    }

    // --- AUDIO ---
    // Ton fichier : assets/audio/Thunderstorm 2.mp3
    // Dans une URL, l'espace devient %20
    const audio = new Audio('assets/audio/Thunderstorm%202.mp3');
    audio.loop = true;
    audio.preload = 'auto';
    audio.volume = 0.25;

    function wireSoundButton(){
      const btn = document.getElementById('soundToggle');
      if (!btn) return;

      function setUi(isOn){
        btn.setAttribute('aria-pressed', String(isOn));
        btn.textContent = isOn ? 'Couper le son' : 'Activer le son';
      }

      async function tryAutoPlay(){
        try{
          await audio.play();
          setUi(true);
        } catch(e){
          // Autoplay bloqué par le navigateur -> bouton pour lancer
          setUi(false);
        }
      }

      btn.addEventListener('click', async () => {
        if (!audio.paused){
          audio.pause();
          setUi(false);
          return;
        }
        try{
          await audio.play();
          setUi(true);
        } catch(e){
          setUi(false);
        }
      });

      tryAutoPlay();
    }

    window.addEventListener('load', () => {
      wireSoundButton();
      setInterval(spawnPollen, 750);
    });
  </script>
</body>
</html>
